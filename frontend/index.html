<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <title>EIP — Energy Intelligence Platform</title>
    <meta
      name="description"
      content="Centralise electricity bills across sites, get automated trends and alerts, see avoidable cost, and connect with the right service providers."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter for everything. The opsz axis lets headings tighten on their own;
         Inter's hinting keeps small text crisp on Windows too. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the theme before first paint so the page never flashes the wrong one.
      // Light by default; dark only if the user picked it (see ThemeContext).
      (function () {
        var dark = false;
        try {
          dark = localStorage.getItem('ui:theme') === 'dark';
        } catch (e) {}
        if (dark) {
          document.documentElement.classList.add('dark');
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', '#070b16');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
