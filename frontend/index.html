<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>EIP — Energy Intelligence Platform</title>
    <meta
      name="description"
      content="Centralise electricity bills across sites, get automated trends and alerts, see avoidable cost, and connect with the right service providers."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Geist for everything, Geist Mono for figures that need to line up. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the theme before first paint so the page never flashes the wrong one.
      // Dark by default; light only if the user picked it (see ThemeContext).
      (function () {
        var light = false;
        try {
          light = localStorage.getItem('ui:theme') === 'light';
        } catch (e) {}
        if (light) {
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', '#f6f6f7');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
